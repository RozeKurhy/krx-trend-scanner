<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="KRX Trend Scanner의 외인 순매수 랭킹">
    <title>외인 순매수 · KRX Trend Scanner</title>
    <script>
      (() => {
        const saved = (() => {
          try {
            const value = localStorage.getItem("krx-theme");
            return value === "light" || value === "dark" ? value : null;
          } catch (error) {
            return null;
          }
        })();
        const system = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = saved || system;
      })();
    </script>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./css/app.css?v=web-foreign-net-buy-1">
  </head>
  <body>
    <a class="skip-link" href="#main-content">본문으로 건너뛰기</a>
    <header class="site-header">
      <div class="shell header-inner">
        <a class="brand" href="./index.html" aria-label="KRX Trend Scanner 홈">
          <span class="brand-mark" aria-hidden="true">K</span>
          <span>
            <span class="brand-name">KRX Trend Scanner</span>
            <span class="brand-context">투자 분석 도구</span>
          </span>
        </a>
        <div class="header-actions">
          <nav class="primary-nav" aria-label="주요 메뉴">
            <a class="nav-item" href="./index.html">데이터 현황</a>
            <a class="nav-item is-active" href="./market.html" aria-current="page">랭킹</a>
            <a class="nav-item" href="./report.html">종목 리포트</a>
            <a class="nav-item" href="./strategy.html">전략 운용</a>
            <span class="nav-item" aria-disabled="true">전략 설명 <small>준비 중</small></span>
          </nav>
          <button id="theme-toggle" class="theme-toggle" type="button" aria-label="어둡게 보기" title="어둡게 보기" aria-pressed="false">
            <span id="theme-icon-sun" class="theme-icon" aria-hidden="true" hidden>
              <svg viewBox="0 0 24 24" focusable="false"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path></svg>
            </span>
            <span id="theme-icon-moon" class="theme-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false"><path d="M20.4 15.4A8.5 8.5 0 0 1 8.6 3.6 8.5 8.5 0 1 0 20.4 15.4Z"></path></svg>
            </span>
            <span id="theme-toggle-label">어둡게 보기</span>
          </button>
        </div>
      </div>
    </header>

    <main id="main-content" class="shell page-content">
      <section class="page-intro" aria-labelledby="page-title">
        <h1 id="page-title">외인 순매수</h1>
        <p class="lede">외국인 사랑을 받는 종목은?</p>
      </section>

      <nav class="ranking-tabs" aria-label="랭킹 종류">
        <a class="ranking-tab" href="./market.html">마켓 RS</a>
        <a class="ranking-tab" href="./sector.html">섹터 RS</a>
        <span class="ranking-tab" aria-disabled="true">섹터 랭킹 <small>준비 중</small></span>
        <a class="ranking-tab is-active" href="./foreign.html" aria-current="page">외인 순매수</a>
        <span class="ranking-tab" aria-disabled="true">매출액 성장률 <small>준비 중</small></span>
        <span class="ranking-tab" aria-disabled="true">영업이익 성장률 <small>준비 중</small></span>
        <span class="ranking-tab" aria-disabled="true">순이익 성장률 <small>준비 중</small></span>
      </nav>

      <section class="panel foreign-controls" aria-labelledby="foreign-controls-heading">
        <div class="foreign-controls-heading">
          <div>
            <h2 id="foreign-controls-heading">외인 순매수 랭킹</h2>
            <p id="foreign-ranking-meta" class="report-search-meta" role="status">랭킹 목록 불러오는 중</p>
          </div>
          <span id="foreign-as-of" class="foreign-as-of">기준일 —</span>
        </div>
        <div id="foreign-horizon-controls" class="market-control-group foreign-control-group" role="group" aria-label="랭킹 기간">
          <button class="market-control" type="button" data-horizon="1d" aria-pressed="false">1일</button>
          <button class="market-control" type="button" data-horizon="5d" aria-pressed="false">5일</button>
          <button class="market-control" type="button" data-horizon="10d" aria-pressed="false">10일</button>
          <button class="market-control is-active" type="button" data-horizon="20d" aria-pressed="true">20일</button>
          <button class="market-control" type="button" data-horizon="60d" aria-pressed="false">60일</button>
        </div>
        <div id="foreign-market-filters" class="market-control-group foreign-control-group" role="group" aria-label="거래소 필터">
          <button class="market-control is-active" type="button" data-market="ALL" aria-pressed="true">전체</button>
          <button class="market-control" type="button" data-market="KOSPI" aria-pressed="false">코스피</button>
          <button class="market-control" type="button" data-market="KOSDAQ" aria-pressed="false">코스닥</button>
        </div>
        <label class="visually-hidden" for="foreign-search">종목명, 종목코드 또는 업종 검색</label>
        <input id="foreign-search" class="report-search-input foreign-search-input" type="search" placeholder="종목명, 종목코드 또는 업종 검색" autocomplete="off" aria-controls="foreign-ranking-list">
      </section>

      <section id="foreign-ranking-list" class="foreign-ranking-list" aria-live="polite" aria-label="외인 순매수 랭킹"></section>

      <section id="foreign-error" class="error-card" hidden aria-live="assertive" aria-labelledby="foreign-error-heading">
        <p class="eyebrow">데이터 불러오기 오류</p>
        <h2 id="foreign-error-heading">외인 순매수 랭킹을 불러올 수 없습니다.</h2>
        <p>외인 순매수 랭킹 데이터 파일을 확인해 주세요.</p>
      </section>
    </main>

    <footer class="site-footer shell">
      <span>KRX Trend Scanner</span>
      <span>읽기 전용</span>
    </footer>
    <script src="./js/foreign.js?v=web-foreign-net-buy-2" defer></script>
  </body>
</html>
