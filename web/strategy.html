<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="KRX Trend Scanner의 전략 운용 현황">
    <title>전략 운용 · KRX Trend Scanner</title>
    <script>
      (() => {
        const saved = (() => {
          try {
            const value = localStorage.getItem("krx-theme");
            return value === "light" || value === "dark" ? value : null;
          } catch (error) {
            return null;
          }
        })();
        const system = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = saved || system;
      })();
    </script>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./css/app.css?v=web-ui-density-9">
  </head>
  <body>
    <a class="skip-link" href="#main-content">본문으로 건너뛰기</a>
    <header class="site-header">
      <div class="shell header-inner">
        <a class="brand" href="./index.html" aria-label="KRX Trend Scanner 홈">
          <span class="brand-mark" aria-hidden="true">K</span>
          <span>
            <span class="brand-name">KRX Trend Scanner</span>
            <span class="brand-context">투자 분석 도구</span>
          </span>
        </a>
        <div class="header-actions">
          <nav class="primary-nav" aria-label="주요 메뉴">
            <a class="nav-item" href="./index.html">데이터 현황</a>
            <a class="nav-item" href="./market.html">랭킹</a>
            <a class="nav-item" href="./report.html">종목 리포트</a>
            <a class="nav-item is-active" href="./strategy.html" aria-current="page">전략 운용</a>
            <span class="nav-item" aria-disabled="true">전략 설명 <small>준비 중</small></span>
          </nav>
          <button id="theme-toggle" class="theme-toggle" type="button" aria-label="어둡게 보기" title="어둡게 보기" aria-pressed="false">
            <span id="theme-icon-sun" class="theme-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path></svg>
            </span>
            <span id="theme-icon-moon" class="theme-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false"><path d="M20.4 15.4A8.5 8.5 0 0 1 8.6 3.6 8.5 8.5 0 1 0 20.4 15.4Z"></path></svg>
            </span>
          </button>
        </div>
      </div>
    </header>

    <main id="main-content" class="shell page-content">
      <section class="panel strategy-overview" aria-labelledby="strategy-overview-heading">
        <div class="panel-heading">
          <h2 id="strategy-overview-heading">현재 전략</h2>
          <p id="strategy-scope" class="strategy-scope">기준일 —</p>
        </div>
        <div class="strategy-selector" role="group" aria-label="전략 선택">
          <button id="fast-core-option" class="strategy-option is-active" type="button" aria-pressed="true">
            <span class="strategy-option-name">A FAST Core</span>
            <span class="strategy-option-detail">패턴 기반 추세 전략</span>
          </button>
          <button id="julia-option" class="strategy-option" type="button" aria-pressed="false" disabled>
            <span class="strategy-option-name">Julia</span>
            <span class="strategy-option-detail">준비 중</span>
          </button>
        </div>
      </section>

      <section class="panel strategy-controls" aria-label="전략 검색 및 필터">
        <label class="visually-hidden" for="strategy-search">종목명 또는 종목코드 검색</label>
        <input id="strategy-search" class="report-search-input" type="search" placeholder="종목명 또는 종목코드 검색" autocomplete="off" aria-controls="strategy-sections">
        <div id="strategy-filters" class="strategy-filter-group" role="group" aria-label="전략 판단 필터">
          <button class="strategy-filter is-active" type="button" data-filter="all" aria-pressed="true">전체 <span id="strategy-filter-count-all" class="strategy-filter-count">—</span></button>
          <button class="strategy-filter" type="button" data-filter="hold" aria-pressed="false">보유 유지 <span id="strategy-filter-count-hold" class="strategy-filter-count">—</span></button>
          <button class="strategy-filter" type="button" data-filter="entry" aria-pressed="false">진입 조건 충족 <span id="strategy-filter-count-entry" class="strategy-filter-count">—</span></button>
          <button class="strategy-filter" type="button" data-filter="exit" aria-pressed="false">매도 조건 충족 <span id="strategy-filter-count-exit" class="strategy-filter-count">—</span></button>
          <button class="strategy-filter" type="button" data-filter="watch" aria-pressed="false">관찰 중 <span id="strategy-filter-count-watch" class="strategy-filter-count">—</span></button>
          <button class="strategy-filter" type="button" data-filter="unavailable" aria-pressed="false">기타 <span id="strategy-filter-count-unavailable" class="strategy-filter-count">—</span></button>
        </div>
      </section>

      <section id="strategy-sections" class="strategy-sections" aria-live="polite">
        <section id="hold-section" class="panel strategy-section" data-category="hold" aria-label="보유 종목">
          <div id="hold-list" class="strategy-item-list"></div>
        </section>
        <section id="entry-section" class="panel strategy-section" data-category="entry" aria-label="진입 조건 충족">
          <div id="entry-list" class="strategy-item-list"></div>
        </section>
        <section id="exit-section" class="panel strategy-section" data-category="exit" aria-label="매도 조건 충족">
          <div id="exit-list" class="strategy-item-list"></div>
        </section>
        <section id="watch-section" class="panel strategy-section" data-category="watch" aria-label="관찰 종목">
          <div id="watch-list" class="strategy-item-list"></div>
        </section>
        <section id="unavailable-section" class="panel strategy-section" data-category="unavailable" aria-label="기타">
          <div id="unavailable-list" class="strategy-item-list"></div>
        </section>
      </section>

      <section id="strategy-error" class="error-card" hidden aria-live="assertive" aria-labelledby="strategy-error-heading">
        <p class="eyebrow">데이터 불러오기 오류</p>
        <h2 id="strategy-error-heading">전략 운용 데이터를 불러올 수 없습니다.</h2>
        <p>정적 strategy monitor 파일을 확인해 주세요.</p>
      </section>
    </main>

    <script src="./js/strategy.js?v=web-02c-toss-5" defer></script>
  </body>
</html>
