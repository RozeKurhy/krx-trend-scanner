<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="KRX Trend Scanner의 마켓 RS 랭킹">
    <title>마켓 RS · KRX Trend Scanner</title>
    <script>
      (() => {
        const saved = (() => {
          try {
            const value = localStorage.getItem("krx-theme");
            return value === "light" || value === "dark" ? value : null;
          } catch (error) {
            return null;
          }
        })();
        const system = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = saved || system;
      })();
    </script>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./css/app.css?v=web-ui-density-6">
  </head>
  <body>
    <a class="skip-link" href="#main-content">본문으로 건너뛰기</a>
    <header class="site-header">
      <div class="shell header-inner">
        <a class="brand" href="./index.html" aria-label="KRX Trend Scanner 홈">
          <span class="brand-mark" aria-hidden="true">K</span>
          <span>
            <span class="brand-name">KRX Trend Scanner</span>
            <span class="brand-context">투자 분석 도구</span>
          </span>
        </a>
        <div class="header-actions">
          <nav class="primary-nav" aria-label="주요 메뉴">
            <a class="nav-item" href="./index.html">데이터 현황</a>
            <a class="nav-item is-active" href="./market.html" aria-current="page">랭킹</a>
            <a class="nav-item" href="./report.html">종목 리포트</a>
            <a class="nav-item" href="./strategy.html">전략 운용</a>
            <span class="nav-item" aria-disabled="true">전략 설명 <small>준비 중</small></span>
          </nav>
          <button id="theme-toggle" class="theme-toggle" type="button" aria-label="어둡게 보기" title="어둡게 보기" aria-pressed="false">
            <span id="theme-icon-sun" class="theme-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path></svg>
            </span>
            <span id="theme-icon-moon" class="theme-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false"><path d="M20.4 15.4A8.5 8.5 0 0 1 8.6 3.6 8.5 8.5 0 1 0 20.4 15.4Z"></path></svg>
            </span>
          </button>
        </div>
      </div>
    </header>

    <main id="main-content" class="shell page-content">
      <nav class="ranking-tabs" aria-label="랭킹 종류">
        <a class="ranking-tab is-active" href="./market.html" aria-current="page">마켓 RS</a>
        <a class="ranking-tab" href="./sector.html">섹터 RS</a>
        <span class="ranking-tab" aria-disabled="true">섹터 랭킹 <small>준비 중</small></span>
        <a class="ranking-tab" href="./foreign.html">외인 순매수</a>
        <span class="ranking-tab" aria-disabled="true">매출액 성장률 <small>준비 중</small></span>
        <span class="ranking-tab" aria-disabled="true">영업이익 성장률 <small>준비 중</small></span>
        <span class="ranking-tab" aria-disabled="true">순이익 성장률 <small>준비 중</small></span>
      </nav>

      <section class="panel market-controls" aria-label="마켓 RS 필터">
        <div class="market-primary-row">
          <div class="market-select-wrap">
            <label class="visually-hidden" for="market-select">시장 선택</label>
            <select id="market-select" class="market-select" aria-label="시장 선택" aria-controls="market-ranking-list">
              <option value="ALL">전체</option>
              <option value="KOSPI">코스피</option>
              <option value="KOSDAQ">코스닥</option>
            </select>
            <span class="market-select-chevron" aria-hidden="true"></span>
          </div>
          <div id="horizon-controls" class="market-control-group market-horizon-group" role="group" aria-label="랭킹 기간">
            <button class="market-control" type="button" data-horizon="2w" aria-pressed="false">2주</button>
            <button class="market-control is-active" type="button" data-horizon="1m" aria-pressed="true">1개월</button>
            <button class="market-control" type="button" data-horizon="3m" aria-pressed="false">3개월</button>
            <button class="market-control" type="button" data-horizon="6m" aria-pressed="false">6개월</button>
            <button class="market-control" type="button" data-horizon="12m" aria-pressed="false">12개월</button>
          </div>
          <p id="market-scope" class="market-scope">기준일 —</p>
        </div>
        <label class="visually-hidden" for="market-search">종목명 또는 종목코드 검색</label>
        <input id="market-search" class="report-search-input market-search-input" type="search" placeholder="종목명 또는 종목코드 검색" autocomplete="off">
        <p id="market-ranking-meta" class="report-search-meta" role="status">랭킹 목록 불러오는 중</p>
      </section>

      <section id="market-ranking-list" class="market-ranking-list" aria-live="polite" aria-label="마켓 RS 랭킹"></section>

      <section id="market-error" class="error-card" hidden aria-live="assertive" aria-labelledby="market-error-heading">
        <p class="eyebrow">데이터 불러오기 오류</p>
        <h2 id="market-error-heading">마켓 RS 랭킹을 불러올 수 없습니다.</h2>
        <p>마켓 RS 랭킹 데이터 파일을 확인해 주세요.</p>
      </section>
    </main>

    <script src="./js/market.js?v=web-02c-toss-4" defer></script>
  </body>
</html>
