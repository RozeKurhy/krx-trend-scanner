[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trend-scanner"
version = "0.1.0"
description = "KOSPI/KOSDAQ 장기 대세 상승 초입 후보 탐색 스크리너"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/trend_scanner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
