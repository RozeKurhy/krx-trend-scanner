[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trend-scanner"
version = "0.1.0"
description = "KOSPI/KOSDAQ 장기 대세 상승 초입 후보 탐색 스크리너"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pykrx>=1.2",
    "pyarrow>=14.0",
    "python-dotenv>=1.0",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/trend_scanner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: 실제 외부 API/network(예: PyKRX)를 호출한다. 기본 실행에서 제외되며 `-m integration`으로만 실행한다.",
    "slow: 로컬 대용량 데이터, 2,528종목 Full Universe Scan, 장시간 historical replay 등 기본 개발 루프에서 제외하는 장시간 테스트. 기본 실행에서 제외되며 `-m slow`로만 실행한다.",
]
addopts = "-m 'not integration and not slow'"
