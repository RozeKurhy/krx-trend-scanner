[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trend-scanner"
version = "0.1.0"
description = "KOSPI/KOSDAQ 장기 대세 상승 초입 후보 탐색 스크리너"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pykrx>=1.2",
    "pyarrow>=14.0",
    "python-dotenv>=1.0",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/trend_scanner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: 실제 외부 API(PyKRX)를 호출한다. 기본 실행에서 제외되며 `-m integration`으로만 실행한다.",
    "slow: 장시간 소요되는 연구 통합 테스트. 대형주 40 전체 재실행 및 전수 PIT 가로채기 검증.",
]
addopts = "-m 'not integration and not slow'"
